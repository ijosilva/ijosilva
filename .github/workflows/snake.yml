# ══════════════════════════════════════════════════════════════════════
#  SNAKE ANIMATION — @ijosilva
#  Salvar em: .github/workflows/snake.yml
#
#  Gera os SVGs da cobrinha e publica na branch "output" do repositório.
#  Em repositório PÚBLICO não consome minutos de Actions.
#
#  Antes do primeiro run, ative:
#  Settings > Actions > General > Workflow permissions > "Read and write"
# ══════════════════════════════════════════════════════════════════════

name: Gerar Snake Animation

on:
  # roda sozinho a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # permite rodar manualmente pela aba Actions
  workflow_dispatch:

  # roda também a cada push na main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Gera os dois SVGs (claro e escuro) na pasta dist/
      - name: Gerar os SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7B2CBF&color_dots=#EBEDF0,#C7E9F1,#7FD4E8,#2FB3D9,#0077A8
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF2E63&color_dots=#161B22,#0B3A45,#0E6B7D,#00A8BF,#00F0FF

      # Publica o conteúdo de dist/ na branch "output"
      # Se esta etapa falhar, troque v4 por v3.1.0 (versão usada na doc oficial)
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
